name: Release Fractal Cloud SDK Package to npmjs

on:
  release:
    types: [created]
jobs:
  # The full dependency, secret and static-analysis scan of the release commit (security.yml in
  # release mode). The jobs that publish wait for it, so nothing ships while it fails.
  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
    with:
      mode: release

  release:
    needs: security
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.x'
          registry-url: 'https://registry.npmjs.org'
      - run: |
          git config --global user.email "hello@fractal.cloud"
          git config --global user.name "HAL9000"
      - run: npm ci
      - run: npm run build
      - run: npm version ${{ github.event.release.tag_name }} --allow-same-version
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
