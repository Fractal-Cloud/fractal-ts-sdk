name: Offer contracts are current

# Fails when an agent has released a parameter contract the committed snapshot
# (contracts/) does not hold yet. See docs/offer-contracts.md. Not part of the
# PR gate: the PR gate is offline, and the agent repositories are private.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.x'
      # The Java agents' 2.0 projection is built from the release tag.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Compare the snapshot with the latest agent releases
        env:
          # Read access to the agent repositories (releases and contents).
          GH_TOKEN: ${{ secrets.AGENT_CONTRACTS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AGENT_CONTRACTS_TOKEN is not set: the agent contracts cannot be read."
            exit 1
          fi
          npm run contracts:check
