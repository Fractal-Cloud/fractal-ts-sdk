name: PR Tests

on:
  pull_request:
    branches:
      - main

jobs:
  build-fractal-cloud-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.x'
      - name: Install dependencies for Fractal Cloud SDK
        run: |
          npm install
      - name: Build Fractal Cloud SDK
        run: |
          npm run build
      - name: Run Unit Tests for Fractal Cloud SDK
        run: |
          npm run test
