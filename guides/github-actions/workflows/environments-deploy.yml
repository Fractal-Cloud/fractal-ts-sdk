name: Deploy environments

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # mint the GitHub OIDC token the AWS roles trust
  contents: read

# Never two deploys at once: a second run would race the first one's
# initialization. Queue instead of cancelling a run that is mid-initialization.
concurrency:
  group: environments-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Initialization can take close to an hour; the roles allow 2h sessions.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: npm ci

      # One step per AWS account, each with its own id.
      - uses: aws-actions/configure-aws-credentials@v4
        id: mgmt
        with:
          role-to-assume: arn:aws:iam::111111111111:role/FractalLandingZoneDeployer
          aws-region: eu-central-1
          role-duration-seconds: 7200
          output-credentials: true
      - uses: aws-actions/configure-aws-credentials@v4
        id: prod
        with:
          role-to-assume: arn:aws:iam::222222222222:role/FractalLandingZoneDeployer
          aws-region: eu-central-1
          role-duration-seconds: 7200
          output-credentials: true
      - uses: aws-actions/configure-aws-credentials@v4
        id: dev
        with:
          role-to-assume: arn:aws:iam::333333333333:role/FractalLandingZoneDeployer
          aws-region: eu-central-1
          role-duration-seconds: 7200
          output-credentials: true

      - run: npx tsx src/deploy.ts
        env:
          SERVICE_ACCOUNT_ID: ${{ secrets.SERVICE_ACCOUNT_ID }}
          SERVICE_ACCOUNT_SECRET: ${{ secrets.SERVICE_ACCOUNT_SECRET }}
          FRACTAL_OWNER_ID: ${{ vars.FRACTAL_OWNER_ID }}
          MGMT_AWS_ACCESS_KEY_ID: ${{ steps.mgmt.outputs.aws-access-key-id }}
          MGMT_AWS_SECRET_ACCESS_KEY: ${{ steps.mgmt.outputs.aws-secret-access-key }}
          MGMT_AWS_SESSION_TOKEN: ${{ steps.mgmt.outputs.aws-session-token }}
          PROD_AWS_ACCESS_KEY_ID: ${{ steps.prod.outputs.aws-access-key-id }}
          PROD_AWS_SECRET_ACCESS_KEY: ${{ steps.prod.outputs.aws-secret-access-key }}
          PROD_AWS_SESSION_TOKEN: ${{ steps.prod.outputs.aws-session-token }}
          DEV_AWS_ACCESS_KEY_ID: ${{ steps.dev.outputs.aws-access-key-id }}
          DEV_AWS_SECRET_ACCESS_KEY: ${{ steps.dev.outputs.aws-secret-access-key }}
          DEV_AWS_SESSION_TOKEN: ${{ steps.dev.outputs.aws-session-token }}
