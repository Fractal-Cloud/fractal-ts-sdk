name: Plan environments

on:
  pull_request:
    branches: [main]

# No id-token: a pull request never gets AWS credentials. The roles trust only
# the default branch, so it could not assume them anyway.
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: npm ci
      - run: npx tsc --noEmit
      # Read-only preview against the control plane: create / update / unchanged.
      # Pull requests from forks get no secrets; skip the preview there.
      - if: github.event.pull_request.head.repo.full_name == github.repository
        run: npx tsx src/plan.ts
        env:
          SERVICE_ACCOUNT_ID: ${{ secrets.SERVICE_ACCOUNT_ID }}
          SERVICE_ACCOUNT_SECRET: ${{ secrets.SERVICE_ACCOUNT_SECRET }}
          FRACTAL_OWNER_ID: ${{ vars.FRACTAL_OWNER_ID }}
